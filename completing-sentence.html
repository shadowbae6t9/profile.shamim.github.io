<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HSC Completing Sentence Mastery</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080b12;
    --card:#111827;
    --card2:#172033;
    --text:#f8fafc;
    --muted:#94a3b8;
    --accent:#7c3aed;
    --accent2:#a78bfa;
    --green:#22c55e;
    --red:#ef4444;
    --gold:#facc15;
    --border:#263244;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#1d1740 0%,#080b12 45%);
    color:var(--text);
    min-height:100vh;
}

button{
    font-family:inherit;
}

.container{
    width:min(950px,94%);
    margin:auto;
}

/* HEADER */

header{
    padding:28px 0 18px;
}

.brand{
    text-align:center;
}

.brand h1{
    font-size:clamp(25px,5vw,42px);
    font-weight:900;
    letter-spacing:-1px;
}

.brand h1 span{
    color:var(--accent2);
}

.brand p{
    color:var(--muted);
    margin-top:8px;
}

/* DASHBOARD */

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:20px 0;
}

.stat{
    background:rgba(17,24,39,.88);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px;
    text-align:center;
}

.stat .number{
    font-size:25px;
    font-weight:900;
}

.stat .label{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

/* PROGRESS */

.progress-box{
    background:var(--card);
    border:1px solid var(--border);
    padding:16px;
    border-radius:16px;
    margin-bottom:18px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
    font-size:14px;
}

.progress-bar{
    width:100%;
    height:10px;
    background:#202938;
    border-radius:99px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:.4s;
}

/* CARD */

.quiz-card{
    background:rgba(17,24,39,.96);
    border:1px solid var(--border);
    border-radius:22px;
    padding:24px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.question-number{
    color:var(--accent2);
    font-weight:800;
    font-size:14px;
    margin-bottom:12px;
}

.question{
    font-size:21px;
    line-height:1.55;
    font-weight:700;
    margin-bottom:20px;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    position:relative;
}

.option input{
    position:absolute;
    opacity:0;
}

.option label{
    display:block;
    padding:15px 16px;
    background:var(--card2);
    border:2px solid var(--border);
    border-radius:14px;
    cursor:pointer;
    transition:.2s;
    line-height:1.4;
}

.option label:hover{
    border-color:var(--accent2);
    transform:translateY(-1px);
}

.option input:checked + label{
    border-color:var(--accent2);
    background:#251b45;
}

.option.correct label{
    border-color:var(--green);
    background:rgba(34,197,94,.12);
}

.option.wrong label{
    border-color:var(--red);
    background:rgba(239,68,68,.12);
}

/* BUTTONS */

.actions{
    display:flex;
    gap:12px;
    margin-top:20px;
}

.btn{
    border:0;
    border-radius:13px;
    padding:14px 20px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.primary{
    background:linear-gradient(135deg,var(--accent),#5b21b6);
    color:white;
    flex:1;
}

.secondary{
    background:#202938;
    color:white;
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

/* FEEDBACK */

.feedback{
    display:none;
    margin-top:18px;
    padding:18px;
    border-radius:15px;
    line-height:1.6;
}

.feedback.show{
    display:block;
}

.feedback.correct{
    background:rgba(34,197,94,.10);
    border:1px solid rgba(34,197,94,.4);
}

.feedback.wrong{
    background:rgba(239,68,68,.10);
    border:1px solid rgba(239,68,68,.4);
}

.feedback-title{
    font-size:18px;
    font-weight:900;
    margin-bottom:8px;
}

.answer{
    color:var(--gold);
    font-weight:800;
}

.bangla{
    color:#cbd5e1;
    margin-top:8px;
}

/* RESULT */

.result{
    display:none;
    text-align:center;
    padding:35px 20px;
}

.result.show{
    display:block;
}

.result h2{
    font-size:32px;
    margin-bottom:12px;
}

.result-score{
    font-size:55px;
    font-weight:900;
    color:var(--accent2);
}

.result p{
    color:var(--muted);
    margin:8px 0;
}

.result-actions{
    margin-top:22px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

/* LOCKED */

.lock-message{
    text-align:center;
    padding:25px;
    color:var(--muted);
}

/* CONFETTI */

.confetti{
    position:fixed;
    width:9px;
    height:15px;
    top:-20px;
    z-index:9999;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

/* LEVEL BADGE */

.level-badge{
    display:inline-block;
    margin-top:12px;
    padding:8px 16px;
    border-radius:99px;
    background:rgba(124,58,237,.18);
    border:1px solid rgba(167,139,250,.4);
    color:var(--accent2);
    font-weight:900;
}

/* FOOTER */

footer{
    text-align:center;
    padding:30px 0;
    color:#64748b;
    font-size:12px;
}

/* MOBILE */

@media(max-width:700px){

    .dashboard{
        grid-template-columns:repeat(2,1fr);
    }

    .quiz-card{
        padding:18px;
    }

    .question{
        font-size:18px;
    }

    .actions{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="brand">
        <h1>HSC <span>Completing Sentence</span></h1>
        <p>Master the grammar. Build your level. Become perfect.</p>
        <div class="level-badge">
            LEVEL <span id="level">1</span>
        </div>
    </div>
</header>

<section class="dashboard">

    <div class="stat">
        <div class="number" id="roundScore">0</div>
        <div class="label">ROUND SCORE</div>
    </div>

    <div class="stat">
        <div class="number" id="bestScore">0</div>
        <div class="label">BEST SCORE</div>
    </div>

    <div class="stat">
        <div class="number" id="totalCorrect">0</div>
        <div class="label">TOTAL CORRECT</div>
    </div>

    <div class="stat">
        <div class="number" id="perfectRounds">0</div>
        <div class="label">PERFECT ROUNDS</div>
    </div>

</section>

<div class="progress-box">

    <div class="progress-top">
        <span>Round Progress</span>
        <strong id="progressText">0 / 15</strong>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

</div>

<main class="quiz-card">

    <div id="quizArea">

        <div class="question-number" id="questionNumber">
            QUESTION 1 OF 15
        </div>

        <div class="question" id="questionText"></div>

        <div class="options" id="options"></div>

        <div class="feedback" id="feedback"></div>

        <div class="actions">

            <button
                class="btn primary"
                id="submitBtn"
                onclick="submitAnswer()"
            >
                CHECK ANSWER
            </button>

        </div>

    </div>

    <div class="result" id="result">

        <h2 id="resultTitle"></h2>

        <div class="result-score" id="resultScore"></div>

        <p id="resultMessage"></p>

        <div class="result-actions">

            <button
                class="btn primary"
                onclick="startNewRound()"
            >
                START NEW ROUND
            </button>

            <button
                class="btn secondary"
                onclick="resetProgress()"
            >
                RESET PROGRESS
            </button>

        </div>

    </div>

</main>

<footer>
    HSC English Grammar Practice • Completing Sentence
</footer>

</div>

},

{
q:"Had I known the truth, I ______ you.",
o:["tell","would tell","would have told","will tell"],
a:2,
e:"Third conditional uses Had + past participle, would have + past participle.",
b:"Third conditional-এর structure হলো Had + past participle, would have + past participle।",
l:2

{

{

b:"অবাস্তব তুলনা বোঝালে 'as if'-এর পরে past form ব্যবহৃত হয়।",

},

{

o:["cannot","could","would","should"],
a:0,

o:["attends","would attend","would have attended","will attend"],

o:["the sooner","sooner","soon","the soon"],

e:"The correlative structure is 'The sooner..., the sooner...'.",

q:"He left the place before I ______ there.",

},

q:"He studied hard lest he ______ fail.",

l:2
},

/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(array){

    const copy=[...array];

    for(let i=copy.length-1;i>0;i--){

        const j=Math.floor(
            Math.random()*(i+1)
        );

        [copy[i],copy[j]]=[
            copy[j],
            copy[i]
        ];

    }

    return copy;
}


/* =========================================================
   START ROUND
   ========================================================= */

function startNewRound(){

    /*
       Unlock questions up to current level.
       Once level increases, more difficult questions become
       available.
    */

    let available=questions.filter(
        q=>q.l<=Math.min(state.level,3)
    );

    if(available.length<15){
        available=questions;
    }

    roundQuestions=
        shuffle(available)
        .slice(0,15);

    currentIndex=0;
    score=0;
    answered=false;

    document.getElementById("quizArea")
        .style.display="block";

    document.getElementById("result")
        .classList.remove("show");

    updateDashboard();

    renderQuestion();

}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

    const q=roundQuestions[currentIndex];

    answered=false;

    document.getElementById("questionNumber")
        .textContent=
        `QUESTION ${currentIndex+1} OF 15`;

    document.getElementById("questionText")
        .textContent=q.q;

    const options=
        document.getElementById("options");

    options.innerHTML="";

    q.o.forEach((option,index)=>{

        const div=document.createElement("div");

        div.className="option";

        div.innerHTML=`
            <input
                type="radio"
                name="answer"
                id="option${index}"
                value="${index}"
            >

            <label for="option${index}">
                <strong>${String.fromCharCode(65+index)}.</strong>
                ${option}
            </label>
        `;

        options.appendChild(div);

    });

    const feedback=
        document.getElementById("feedback");

    feedback.className="feedback";
    feedback.innerHTML="";

    document.getElementById("submitBtn")
        .disabled=false;

    updateDashboard();

}

   ========================================================= */

function submitAnswer(){

    if(answered) return;

    const selected=
        document.querySelector(
            'input[name="answer"]:checked'
        );

    if(!selected){

        alert("Please select an answer first.");

        return;
    }

    answered=true;

    const selectedIndex=
        Number(selected.value);

    const q=
        roundQuestions[currentIndex];

    const feedback=
        document.getElementById("feedback");

    const optionElements=
        document.querySelectorAll(".option");

    optionElements.forEach((el,index)=>{

        if(index===q.a){

            el.classList.add("correct");

        }

        if(index===selectedIndex &&
           selectedIndex!==q.a){

            el.classList.add("wrong");

        }

    });

    if(selectedIndex===q.a){

        score++;

        state.totalCorrect++;

        feedback.className=
            "feedback show correct";

        feedback.innerHTML=`
            <div class="feedback-title">
                ✓ Correct!
            </div>

            <div>
                <strong>Answer:</strong>
                <span class="answer">
                    ${q.o[q.a]}
                </span>
            </div>

            <div>
                <strong>Explanation:</strong>
                ${q.e}
            </div>

            <div class="bangla">
                🇧🇩 ${q.b}
            </div>
        `;

        playCorrectSound();

    }else{

        feedback.className=
            "feedback show wrong";

        feedback.innerHTML=`
            <div class="feedback-title">
                ✗ Incorrect
            </div>

            <div>
                <strong>Your answer:</strong>
                ${q.o[selectedIndex]}
            </div>

            <div>
                <strong>Correct answer:</strong>
                <span class="answer">
                    ${q.o[q.a]}
                </span>
            </div>

            <div>
                <strong>Explanation:</strong>
                ${q.e}
            </div>

            <div class="bangla">
                🇧🇩 ${q.b}
            </div>
        `;

        playWrongSound();

    }

    document.getElementById("submitBtn")
        .disabled=true;

    currentIndex++;

    updateDashboard();

    setTimeout(()=>{

        if(currentIndex<15){

            renderQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }else{

            finishRound();

        }

    },1200);

}


/* =========================================================
   FINISH ROUND
   ========================================================= */

function finishRound(){

    state.totalRounds++;

    if(score>state.bestScore){

        state.bestScore=score;

    }

    document.getElementById("quizArea")
        .style.display="none";

    const result=
        document.getElementById("result");

    result.classList.add("show");

    document.getElementById("resultScore")
        .textContent=`${score} / 15`;

    if(score===15){

        state.perfectRounds++;

        state.level++;

        saveProgress();

        document.getElementById("resultTitle")
            .textContent=
            "🎉 PERFECT ROUND! 🎉";

        document.getElementById("resultMessage")
            .innerHTML=
            `
            <strong>
            15/15 — 100% CORRECT!
            </strong>
            <br><br>
            🔓 LEVEL ${state.level} UNLOCKED!
            <br>
            You have mastered this round.
            `;

        celebrate();

        playLevelUpSound();

    }else{

        saveProgress();

        document.getElementById("resultTitle")
            .textContent=
            "Round Complete";

        document.getElementById("resultMessage")
            .innerHTML=
            `
            You scored <strong>${score}/15</strong>.
            <br><br>
            Get <strong>15/15</strong> in a round
            to unlock the next level.
            `;

    }

    updateDashboard();

}


/* =========================================================
   RESET
   ========================================================= */

function resetProgress(){

    const yes=
        confirm(
            "Reset ALL level and quiz progress?"
        );

    if(!yes) return;

    localStorage.removeItem(STORAGE_KEY);

    state={
        level:1,
        bestScore:0,
        totalCorrect:0,
        perfectRounds:0,
        totalRounds:0
    };

    startNewRound();

}


/* =========================================================
   CONFETTI
   ========================================================= */

function celebrate(){

    for(let i=0;i<120;i++){

        const piece=
            document.createElement("div");

        piece.className="confetti";

        piece.style.left=
            Math.random()*100+"vw";

        piece.style.animationDelay=
            Math.random()*1.5+"s";

        piece.style.background=
            [
                "#7c3aed",
                "#22c55e",
                "#facc15",
                "#ef4444",
                "#38bdf8",
                "#f97316"
            ][
                Math.floor(Math.random()*6)
            ];

        piece.style.transform=
            `rotate(${Math.random()*360}deg)`;

        document.body.appendChild(piece);

        setTimeout(
            ()=>piece.remove(),
            4500
        );

    }

}


/* =========================================================
   SOUND EFFECTS
   ========================================================= */

function audioContext(){

    return new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

}

function tone(
    frequency,
    duration,
    type="sine"
){

    try{

        const ctx=audioContext();

        const oscillator=
            ctx.createOscillator();

        const gain=
            ctx.createGain();

        oscillator.type=type;

        oscillator.frequency.value=
            frequency;

        oscillator.connect(gain);

        gain.connect(ctx.destination);

        gain.gain.setValueAtTime(
            .12,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime+duration
        );

        oscillator.start();

        oscillator.stop(
            ctx.currentTime+duration
        );

    }catch(e){}

}

function playCorrectSound(){

    tone(650,.12);

    setTimeout(
        ()=>tone(850,.15),
        100
    );

}

function playWrongSound(){

    tone(180,.25,"square");

}

function playLevelUpSound(){

    tone(500,.15);

    setTimeout(
        ()=>tone(700,.15),
        130
    );

    setTimeout(
        ()=>tone(900,.25),
        260
    );

}


/* =========================================================
   START
   ========================================================= */

startNewRound();

</script>
