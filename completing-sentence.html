<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="HSC English 2nd Paper Completing Sentence Practice Quiz">
<meta name="theme-color" content="#070b14">

<title>HSC Completing Sentence Quiz | English 2nd Paper</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070b14;
    --card:#0d1422;
    --card2:#111a2b;
    --border:rgba(255,255,255,.10);
    --text:#f4f7fb;
    --muted:#9ba8bb;
    --accent:#6ee7ff;
    --accent2:#8b5cf6;
    --green:#36e39b;
    --red:#ff647c;
    --yellow:#ffd166;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(110,231,255,.08),transparent 30%),
        radial-gradient(circle at 90% 20%,rgba(139,92,246,.10),transparent 30%),
        var(--bg);
    color:var(--text);
    padding:18px;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:min(100%,1050px);
    margin:auto;
}

header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:18px;
    border:1px solid var(--border);
    border-radius:20px;
    background:rgba(13,20,34,.88);
    backdrop-filter:blur(16px);
    margin-bottom:15px;
}

.brand h1{
    font-size:clamp(20px,4vw,30px);
    margin-bottom:5px;
}

.brand p{
    color:var(--muted);
    font-size:13px;
}

.header-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.small-btn{
    border:1px solid var(--border);
    background:#111a2b;
    color:white;
    padding:9px 12px;
    border-radius:10px;
    transition:.2s;
}

.small-btn:hover{
    transform:translateY(-1px);
    border-color:var(--accent);
}

.small-btn:focus-visible,
.option:focus-visible,
.main-btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
}

.save-status{
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:var(--muted);
    font-size:12px;
    margin:8px 3px 15px;
}

.save-ok{
    color:var(--green);
}

.save-warning{
    color:var(--yellow);
}

.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:15px;
}

.stat{
    padding:15px;
    border:1px solid var(--border);
    border-radius:16px;
    background:rgba(13,20,34,.88);
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    margin-bottom:6px;
}

.stat-value{
    font-size:23px;
    font-weight:bold;
}

.progress-wrap{
    grid-column:1/-1;
}

.progress{
    width:100%;
    height:9px;
    background:#202a3b;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .3s ease;
}

.card{
    border:1px solid var(--border);
    border-radius:22px;
    background:rgba(13,20,34,.92);
    padding:22px;
    box-shadow:0 15px 50px rgba(0,0,0,.22);
}

.question-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:18px;
}

.question-number{
    font-size:13px;
    color:var(--muted);
}

.badge{
    padding:6px 10px;
    border-radius:999px;
    background:rgba(110,231,255,.10);
    color:var(--accent);
    font-size:11px;
    border:1px solid rgba(110,231,255,.15);
}

.rule{
    margin-bottom:16px;
    padding:10px 12px;
    border-radius:12px;
    background:#101a2c;
    color:#b9c7da;
    font-size:13px;
}

.question{
    font-size:clamp(19px,3vw,26px);
    line-height:1.55;
    margin-bottom:13px;
}

.translation{
    color:#b6c2d3;
    background:rgba(255,255,255,.035);
    padding:12px;
    border-radius:12px;
    margin-bottom:18px;
    line-height:1.6;
    font-size:14px;
}

.options{
    display:grid;
    gap:11px;
}

.option{
    width:100%;
    text-align:left;
    padding:15px;
    border-radius:14px;
    border:1px solid var(--border);
    background:#101827;
    color:var(--text);
    transition:.2s;
}

.option:hover:not(:disabled){
    border-color:var(--accent);
    transform:translateY(-1px);
}

.option.correct{
    border-color:var(--green);
    background:rgba(54,227,155,.10);
}

.option.wrong{
    border-color:var(--red);
    background:rgba(255,100,124,.10);
}

.option:disabled{
    cursor:default;
}

.option-label{
    display:inline-flex;
    width:29px;
    height:29px;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#202b3e;
    margin-right:8px;
    font-weight:bold;
}

.feedback{
    margin-top:18px;
    padding:16px;
    border-radius:14px;
    line-height:1.65;
    display:none;
}

.feedback.show{
    display:block;
}

.feedback.correct-feedback{
    background:rgba(54,227,155,.08);
    border:1px solid rgba(54,227,155,.25);
}

.feedback.wrong-feedback{
    background:rgba(255,100,124,.08);
    border:1px solid rgba(255,100,124,.25);
}

.explain-title{
    font-weight:bold;
    margin-bottom:7px;
}

.next-wrap{
    display:flex;
    justify-content:flex-end;
    margin-top:18px;
}

.main-btn{
    border:0;
    color:#061018;
    font-weight:bold;
    padding:12px 18px;
    border-radius:12px;
    background:linear-gradient(135deg,var(--accent),#b4f3ff);
}

.secondary-btn{
    background:#172237;
    color:white;
    border:1px solid var(--border);
}

.main-btn:hover{
    filter:brightness(1.07);
    transform:translateY(-1px);
}

.result{
    text-align:center;
}

.result h2{
    font-size:30px;
    margin-bottom:10px;
}

.result-score{
    font-size:48px;
    font-weight:bold;
    margin:20px 0;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:20px 0;
}

.result-box{
    background:#101827;
    padding:15px;
    border-radius:14px;
}

.result-box small{
    color:var(--muted);
    display:block;
    margin-bottom:6px;
}

.result-box strong{
    font-size:23px;
}

.result-actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

.warning{
    padding:15px;
    border-radius:14px;
    background:rgba(255,209,102,.08);
    border:1px solid rgba(255,209,102,.25);
    color:#ffe6a2;
    margin-bottom:15px;
    line-height:1.5;
}

.review-item{
    text-align:left;
    padding:16px;
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:10px;
    background:#101827;
}

.review-item strong{
    display:block;
    margin-bottom:8px;
}

.review-item .right{
    color:var(--green);
}

.review-item .user-wrong{
    color:var(--red);
}

footer{
    text-align:center;
    color:#69768b;
    font-size:12px;
    padding:20px 0 8px;
}

@media(max-width:650px){
    body{
        padding:10px;
    }

    header{
        align-items:flex-start;
        flex-direction:column;
    }

    .header-actions{
        width:100%;
        justify-content:flex-start;
    }

    .dashboard{
        grid-template-columns:1fr;
    }

    .progress-wrap{
        grid-column:auto;
    }

    .card{
        padding:16px;
    }

    .result-grid{
        grid-template-columns:1fr;
    }
}

@media(prefers-reduced-motion:reduce){
    *{
        scroll-behavior:auto!important;
        transition:none!important;
        animation:none!important;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="brand">
        <h1>HSC Completing Sentence</h1>
        <p>English 2nd Paper • 150 Genuine MCQs</p>
    </div>

    <div class="header-actions">
        <button type="button" class="small-btn" id="soundBtn" onclick="toggleSound()">🔊 Sound</button>
        <button type="button" class="small-btn" onclick="exportProgress()">⬇ Export</button>
        <button type="button" class="small-btn" onclick="document.getElementById('importFile').click()">⬆ Import</button>
        <input type="file" id="importFile" accept=".json" hidden onchange="importProgress(event)">
    </div>
</header>

<div class="save-status">
    <span id="saveStatus">Progress system ready</span>
    <span id="xpStatus">XP: 0</span>
</div>

<div id="warningArea"></div>

<section class="dashboard">
    <div class="stat">
        <div class="stat-label">CURRENT ROUND</div>
        <div class="stat-value" id="roundDisplay">1 / 10</div>
    </div>

    <div class="stat">
        <div class="stat-label">ROUND SCORE</div>
        <div class="stat-value" id="scoreDisplay">0 / 15</div>
    </div>

    <div class="progress-wrap stat">
        <div class="stat-label">ROUND PROGRESS</div>
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>
</section>

<main id="appContent"></main>

<footer>
    HSC English 2nd Paper • Completing Sentence Practice
</footer>

</div>

<canvas id="confettiCanvas"
style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none;"></canvas>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const TOTAL_ROUNDS = 10;
const QUESTIONS_PER_ROUND = 15;
const TOTAL_QUESTIONS = 150;

const STORAGE_KEY = "hscCompletingSentenceProgress_v3";
const SETTINGS_KEY = "hscCompletingSentenceSettings_v3";

const LETTERS = ["A","B","C","D"];


/* =========================================================
   150 GENUINE QUESTION BANK
=========================================================

   Format:
   round,
   rule,
   difficulty,
   question,
   Bengali translation,
   choices,
   correct,
   explanation

========================================================= */

const QUESTIONS = [

/* ================= ROUND 1 =================
   FOUNDATION: BASIC COMPLETING SENTENCE
================================================ */

{
r:1,rule:"It is high time + past tense",d:"Foundation",
q:"It is high time we ____ our bad habits.",
bn:"এখনই আমাদের বদ অভ্যাসগুলো ত্যাগ করার উপযুক্ত সময়।",
c:["change","changed","will change","have changed"],a:1,
e:"After 'It is high time', the subject is normally followed by a past-tense verb."
},

{
r:1,rule:"If + present, future",d:"Foundation",
q:"If you work hard, you ____ succeed.",
bn:"তুমি কঠোর পরিশ্রম করলে সফল হবে।",
c:["would","will","had","were"],a:1,
e:"A real future condition uses present tense in the if-clause and 'will' in the main clause."
},

{
r:1,rule:"Unless = if not",d:"Foundation",
q:"Unless you hurry, you ____ the train.",
bn:"তুমি তাড়াতাড়ি না করলে ট্রেনটি ধরতে পারবে না।",
c:["will miss","would miss","missed","had missed"],a:0,
e:"'Unless' means 'if not'; therefore the future result takes 'will miss'."
},

{
r:1,rule:"Lest + should",d:"Foundation",
q:"Take an umbrella lest you ____ get wet.",
bn:"ছাতা নাও, পাছে তুমি ভিজে যাও।",
c:["would","should","could","might"],a:1,
e:"In traditional HSC grammar, 'lest' is commonly followed by 'should' + base verb."
},

{
r:1,rule:"Since + past, present perfect",d:"Foundation",
q:"It has been five years since he ____ here.",
bn:"সে এখানে আসার পর পাঁচ বছর হয়ে গেছে।",
c:["comes","came","has come","had come"],a:1,
e:"After 'since' referring to a starting point in the past, the simple past is normally used."
},

{
r:1,rule:"Until + present for future",d:"Foundation",
q:"Wait here until I ____ back.",
bn:"আমি ফিরে না আসা পর্যন্ত এখানে অপেক্ষা করো।",
c:["will come","came","come","had come"],a:2,
e:"After 'until' referring to the future, English normally uses the present simple."
},

{
r:1,rule:"Would rather + past",d:"Foundation",
q:"I would rather you ____ tomorrow.",
bn:"আমি চাই তুমি বরং আগামীকাল আসো।",
c:["come","came","will come","have come"],a:1,
e:"When the subject after 'would rather' is different, traditional grammar uses the past tense."
},

{
r:1,rule:"Too + adjective + to",d:"Foundation",
q:"The box is too heavy for me ____.",
bn:"বাক্সটি আমার তোলার জন্য অতিরিক্ত ভারী।",
c:["lift","to lift","lifting","lifted"],a:1,
e:"The standard structure is 'too + adjective + to + base verb'."
},

{
r:1,rule:"So + adjective + that",d:"Foundation",
q:"The man was so weak that he ____ walk.",
bn:"লোকটি এত দুর্বল ছিল যে সে হাঁটতে পারেনি।",
c:["could not","cannot","will not","would not"],a:0,
e:"The past situation requires 'could not' in the result clause."
},

{
r:1,rule:"No sooner ... than",d:"Foundation",
q:"No sooner had he reached the station ____ the train left.",
bn:"সে স্টেশনে পৌঁছানো মাত্রই ট্রেনটি ছেড়ে দিল।",
c:["when","than","then","as"],a:1,
e:"The fixed correlative structure is 'no sooner ... than'."
},

{
r:1,rule:"Hardly ... when",d:"Foundation",
q:"Hardly had I entered the room ____ the phone rang.",
bn:"আমি ঘরে ঢুকতেই ফোন বেজে উঠল।",
c:["than","when","then","that"],a:1,
e:"The standard pair is 'hardly/scarcely ... when'."
},

{
r:1,rule:"Wish + past",d:"Foundation",
q:"I wish I ____ a bird.",
bn:"ইশ, আমি যদি একটি পাখি হতাম!",
c:["am","were","will be","have been"],a:1,
e:"For a present unreal wish, 'were' is traditionally used with all subjects."
},

{
r:1,rule:"Without + gerund",d:"Foundation",
q:"He left without ____ goodbye.",
bn:"সে বিদায় না জানিয়েই চলে গেল।",
c:["say","saying","to say","said"],a:1,
e:"'Without' is a preposition and is followed by a gerund."
},

{
r:1,rule:"By + gerund",d:"Foundation",
q:"You can improve your English by ____ regularly.",
bn:"নিয়মিত অনুশীলনের মাধ্যমে তুমি ইংরেজি উন্নত করতে পারো।",
c:["practice","practised","practising","to practise"],a:2,
e:"'By' is followed by a gerund when it expresses method."
},

{
r:1,rule:"As if + unreal past",d:"Foundation",
q:"He talks as if he ____ everything.",
bn:"সে এমনভাবে কথা বলে যেন সে সবকিছু জানে।",
c:["knows","knew","will know","has known"],a:1,
e:"For an unreal or contrary-to-fact present impression, 'as if + past' is used."
},


/* ================= ROUND 2 =================
   CONDITIONALS
================================================ */

{
r:2,rule:"Second conditional",d:"Intermediate",
q:"If I ____ rich, I would help the poor.",
bn:"আমি ধনী হলে গরিবদের সাহায্য করতাম।",
c:["am","were","will be","have been"],a:1,
e:"The second conditional uses past tense in the if-clause; 'were' is standard for unreal conditions."
},

{
r:2,rule:"Third conditional",d:"Intermediate",
q:"If he had studied harder, he ____ the examination.",
bn:"সে আরও ভালোভাবে পড়লে পরীক্ষায় পাস করত।",
c:["will pass","would pass","would have passed","passed"],a:2,
e:"The third conditional uses 'had + past participle' and 'would have + past participle'."
},

{
r:2,rule:"First conditional",d:"Intermediate",
q:"If it rains tomorrow, we ____ at home.",
bn:"আগামীকাল বৃষ্টি হলে আমরা বাড়িতে থাকব।",
c:["stayed","would stay","will stay","had stayed"],a:2,
e:"A likely future condition uses present simple after 'if' and 'will' in the result."
},

{
r:2,rule:"Unless",d:"Intermediate",
q:"Unless you obey the rules, you ____ punished.",
bn:"তুমি নিয়ম না মানলে শাস্তি পাবে।",
c:["will be","would be","were","had been"],a:0,
e:"'Unless' means 'if not', and the likely result here is future."
},

{
r:2,rule:"Provided that",d:"Intermediate",
q:"You may go out provided that you ____ your homework.",
bn:"তুমি বাইরে যেতে পারো, যদি তোমার বাড়ির কাজ শেষ করো।",
c:["finish","finished","will finish","had finished"],a:0,
e:"'Provided that' introduces a real condition; present simple is used for a future condition."
},

{
r:2,rule:"In case",d:"Intermediate",
q:"Take some money in case you ____ to buy something.",
bn:"কিছু টাকা নাও, যদি কিছু কিনতে হয়।",
c:["need","needed","will need","had needed"],a:0,
e:"After 'in case' for a possible future event, present simple is normally used."
},

{
r:2,rule:"Were I",d:"Intermediate",
q:"Were I you, I ____ the offer.",
bn:"আমি তোমার জায়গায় হলে প্রস্তাবটি গ্রহণ করতাম।",
c:["accept","will accept","would accept","accepted"],a:2,
e:"'Were I you' is an inverted second conditional and takes 'would + base verb'."
},

{
r:2,rule:"Had + subject",d:"Intermediate",
q:"Had I known the truth, I ____ him.",
bn:"আমি সত্যটি জানলে তাকে সাহায্য করতাম।",
c:["help","would help","would have helped","helped"],a:2,
e:"'Had I known' is an inverted third conditional; the result is 'would have + past participle'."
},

{
r:2,rule:"Should + subject inversion",d:"Intermediate",
q:"Should you need help, ____ me immediately.",
bn:"তোমার সাহায্যের প্রয়োজন হলে আমাকে সঙ্গে সঙ্গে জানিও।",
c:["contact","contacted","would contact","had contacted"],a:0,
e:"'Should you...' expresses a possible future condition and is followed by the base verb in the result."
},

{
r:2,rule:"If + past perfect",d:"Intermediate",
q:"If she had taken the medicine, she ____ better now.",
bn:"সে ওষুধটি খেলে এখন আরও ভালো থাকত।",
c:["is","would be","will be","was"],a:1,
e:"This is a mixed conditional: a past condition produces a present result."
},

{
r:2,rule:"If only + past",d:"Intermediate",
q:"If only I ____ more time!",
bn:"ইশ, আমার যদি আরও সময় থাকত!",
c:["have","had","will have","would have"],a:1,
e:"'If only' expressing a present wish is followed by the past tense."
},

{
r:2,rule:"But for",d:"Intermediate",
q:"But for your help, I ____ the task.",
bn:"তোমার সাহায্য না থাকলে আমি কাজটি শেষ করতে পারতাম না।",
c:["could not have completed","cannot complete","will not complete","did not complete"],a:0,
e:"'But for' means 'if it were not for' and can express an unreal past condition."
},

{
r:2,rule:"Otherwise",d:"Intermediate",
q:"Study hard; otherwise you ____ fail.",
bn:"কঠোর পরিশ্রম করো; নইলে তুমি ব্যর্থ হবে।",
c:["would","will","had","were"],a:1,
e:"'Otherwise' means 'if not'; the likely future result takes 'will'."
},

{
r:2,rule:"Without + condition",d:"Intermediate",
q:"Without your advice, I ____ the wrong decision.",
bn:"তোমার পরামর্শ ছাড়া আমি ভুল সিদ্ধান্ত নিতাম।",
c:["would make","would have made","will make","made"],a:1,
e:"The sentence refers to an unreal past result, so 'would have made' is appropriate."
},

{
r:2,rule:"As long as",d:"Intermediate",
q:"You can stay here as long as you ____ quiet.",
bn:"তুমি শান্ত থাকলে এখানে থাকতে পারো।",
c:["remain","remained","will remain","had remained"],a:0,
e:"'As long as' introduces a condition; present simple is used here."
},


/* ================= ROUND 3 =================
   TIME / SEQUENCE
================================================ */

{

r:10,rule:"It is high time",d:"Intermediate",
q:"It is high time the authorities ____ action.",
bn:"কর্তৃপক্ষের এখনই পদক্ষেপ নেওয়ার সময় হয়েছে।",
c:["take","took","will take","have taken"],a:1,
e:"'It is high time + subject' traditionally takes the past tense."
}

];


/* =========================================================
   VALIDATION
========================================================= */

function validateBank(){

    const errors=[];
    const ids=new Set();

    if(QUESTIONS.length!==TOTAL_QUESTIONS){
        errors.push(
            `Question bank contains ${QUESTIONS.length} questions instead of ${TOTAL_QUESTIONS}.`
        );
    }

    QUESTIONS.forEach((q,i)=>{

        if(!q.q || !q.bn || !q.rule || !q.d){
            errors.push(`Question ${i+1}: missing required text.`);
        }

        if(!Array.isArray(q.c) || q.c.length!==4){
            errors.push(`Question ${i+1}: must have exactly 4 choices.`);
        }

        if(q.a<0 || q.a>3){
            errors.push(`Question ${i+1}: invalid correct answer.`);
        }

        if(ids.has(i+1)){
            errors.push(`Duplicate question ID at ${i+1}.`);
        }

        ids.add(i+1);
    });

    for(let r=1;r<=TOTAL_ROUNDS;r++){

        const count=QUESTIONS.filter(q=>q.r===r).length;

        if(count!==QUESTIONS_PER_ROUND){
            errors.push(
                `Round ${r} contains ${count} questions instead of ${QUESTIONS_PER_ROUND}.`
            );
        }
    }

    return errors;
}

const bankErrors=validateBank();


/* =========================================================
   STATE
========================================================= */

const DEFAULT_PROGRESS={
    version:3,
    completedRounds:[],
    totalCorrect:0,
    currentRound:1,
    activeRound:null,
    activeQuestionIndex:0,
    activeRoundScore:0,
    activeRoundQuestions:[],
    activeRoundAnswers:[],
    xp:0,
    streak:0,
    bestStreak:0,
    quizCompleted:false,
    lastSaved:null
};

let progress={...DEFAULT_PROGRESS};

let currentRound=1;
let roundQuestions=[];
let roundAnswers=[];
let currentQuestionIndex=0;
let roundScore=0;
let selected=null;

let soundEnabled=true;


/* =========================================================
   SAFE STORAGE
========================================================= */

function safeSave(key,value){

    try{
        localStorage.setItem(key,JSON.stringify(value));
        return true;
    }catch(error){

        console.warn("Storage unavailable:",error);

        document.getElementById("saveStatus").textContent=
            "⚠ Auto-save unavailable";

        document.getElementById("saveStatus").className=
            "save-warning";

        return false;
    }
}

function safeLoad(key){

    try{
        const value=localStorage.getItem(key);
        return value?JSON.parse(value):null;
    }catch(error){
        return null;
    }
}


/* =========================================================
   PROGRESS
========================================================= */

function loadProgress(){

    const saved=safeLoad(STORAGE_KEY);

    if(saved && typeof saved==="object"){

        progress={
            ...DEFAULT_PROGRESS,
            ...saved
        };
    }

    const settings=safeLoad(SETTINGS_KEY);

    if(settings && typeof settings==="object"){
        soundEnabled=settings.sound!==false;
    }
}

function saveProgress(){

    progress.currentRound=currentRound;

    progress.activeRound=currentRound;
    progress.activeQuestionIndex=currentQuestionIndex;
    progress.activeRoundScore=roundScore;

    progress.activeRoundQuestions=
        roundQuestions.map(q=>QUESTIONS.indexOf(q));

    progress.activeRoundAnswers=
        roundAnswers.map(a=>a===undefined?null:a);

    progress.lastSaved=new Date().toISOString();

    const ok=safeSave(STORAGE_KEY,progress);

    if(ok){

        const time=new Date().toLocaleTimeString([],{
            hour:"2-digit",
            minute:"2-digit"
        });

        document.getElementById("saveStatus").textContent=
            `✓ Progress saved • ${time}`;

        document.getElementById("saveStatus").className=
            "save-ok";

        document.getElementById("xpStatus").textContent=
            `XP: ${progress.xp}`;
    }

    return ok;
}

function saveSettings(){

    safeSave(SETTINGS_KEY,{
        sound:soundEnabled
    });
}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const arr=[...array];

    for(let i=arr.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [arr[i],arr[j]]=[arr[j],arr[i]];
    }

    return arr;
}


/*
   IMPORTANT:
   The correct answer is NOT permanently tied to A.

   Every round:
   1. questions are shuffled
   2. choices are shuffled
   3. the correct index is recalculated

   Therefore the visible answer position changes.
*/

function prepareQuestion(original){

    const choices=original.c.map((text,index)=>({
        text,
        correct:index===original.a
    }));

    const shuffled=shuffle(choices);

    return {
        ...original,
        choices:shuffled
    };
}


/* =========================================================
   START / RESTORE ROUND
========================================================= */

function startRound(round){

    currentRound=round;

    const savedCanResume=
        progress.activeRound===round &&
        Array.isArray(progress.activeRoundQuestions) &&
        progress.activeRoundQuestions.length===QUESTIONS_PER_ROUND;

    if(savedCanResume){

        const restored=
            progress.activeRoundQuestions
            .map(index=>QUESTIONS[index])
            .filter(Boolean);

        if(restored.length===QUESTIONS_PER_ROUND){

            roundQuestions=restored;

            roundAnswers=
                Array.isArray(progress.activeRoundAnswers)
                ? progress.activeRoundAnswers
                : new Array(QUESTIONS_PER_ROUND).fill(null);

            currentQuestionIndex=
                Math.min(
                    Math.max(
                        Number(progress.activeQuestionIndex)||0,
                        0
                    ),
                    QUESTIONS_PER_ROUND-1
                );

            roundScore=
                Math.max(
                    0,
                    Number(progress.activeRoundScore)||0
                );

            selected=roundAnswers[currentQuestionIndex] ?? null;

            showQuestion();
            return;
        }
    }

    const bankRound=
        QUESTIONS
        .filter(q=>q.r===round)
        .map(prepareQuestion);

    roundQuestions=shuffle(bankRound);

    roundAnswers=new Array(QUESTIONS_PER_ROUND).fill(null);

    currentQuestionIndex=0;
    roundScore=0;
    selected=null;

    saveProgress();

    showQuestion();
}


/* =========================================================
   DISPLAY QUESTION
========================================================= */

function showQuestion(){

    if(bankErrors.length){

        showBankError();
        return;
    }

    const q=roundQuestions[currentQuestionIndex];

    if(!q){

        showBankError();
        return;
    }

    document.getElementById("roundDisplay").textContent=
        `${currentRound} / ${TOTAL_ROUNDS}`;

    document.getElementById("scoreDisplay").textContent=
        `${roundScore} / ${QUESTIONS_PER_ROUND}`;

    const answeredCount=
        roundAnswers.filter(x=>x!==null && x!==undefined).length;

    const progressPercent=
        Math.round(
            (answeredCount/QUESTIONS_PER_ROUND)*100
        );

    document.getElementById("progressBar").style.width=
        `${progressPercent}%`;

    const letters=LETTERS;

    const optionsHTML=q.choices.map((choice,i)=>{

        const isSelected=
            selected!==null &&
            selected!==undefined &&
            selected===i;

        const correctChoice=
            choice.correct;

        let cls="option";

        if(selected!==null){

            if(correctChoice){
                cls+=" correct";
            }

            if(isSelected && !correctChoice){
                cls+=" wrong";
            }
        }

        return `
            <button
                type="button"
                class="${cls}"
                ${selected!==null ? "disabled":""}
                onclick="selectAnswer(${i})"
            >
                <span class="option-label">${letters[i]}</span>
                ${escapeHTML(choice.text)}
            </button>
        `;
    }).join("");

    const feedbackHTML=
        selected!==null
        ? buildFeedback(q)
        : "";

    document.getElementById("appContent").innerHTML=`

        <section class="card">

            <div class="question-top">

                <span class="question-number">
                    Question ${currentQuestionIndex+1}
                    of ${QUESTIONS_PER_ROUND}
                </span>

                <span class="badge">
                    ${escapeHTML(q.d)}
                </span>

            </div>

            <div class="rule">
                <strong>Structure:</strong>
                ${escapeHTML(q.rule)}
            </div>

            <div class="question">
                ${escapeHTML(q.q)}
            </div>

            <div class="translation">
                <strong>বাংলা:</strong>
                ${escapeHTML(q.bn)}
            </div>

            <div class="options">
                ${optionsHTML}
            </div>

            ${feedbackHTML}

        </section>
    `;

    window.scrollTo({
        top:0,
        behavior:
            window.matchMedia("(prefers-reduced-motion: reduce)").matches
            ? "auto"
            : "smooth"
    });
}


/* =========================================================
   ANSWER
========================================================= */

function selectAnswer(index){

    if(selected!==null) return;

    const q=roundQuestions[currentQuestionIndex];

    if(!q || !q.choices[index]) return;

    selected=index;

    roundAnswers[currentQuestionIndex]=index;

    const isCorrect=q.choices[index].correct;

    if(isCorrect){

        roundScore++;

        progress.totalCorrect++;

        progress.xp+=10;

        progress.streak++;

        if(progress.streak>progress.bestStreak){
            progress.bestStreak=progress.streak;
        }

        beep("correct");

    }else{

        progress.streak=0;

        beep("wrong");
    }

    saveProgress();

    showQuestion();

    if(isCorrect){
        setTimeout(()=>{
            if(currentQuestionIndex===QUESTIONS_PER_ROUND-1){
                confetti();
            }
        },100);
    }
}


/* =========================================================
   FEEDBACK
========================================================= */

function buildFeedback(q){

    const selectedChoice=q.choices[selected];

    const correctChoice=
        q.choices.find(choice=>choice.correct);

    if(!selectedChoice || !correctChoice){
        return "";
    }

    const correct=
        selectedChoice.correct;

    const selectedLetter=
        LETTERS[q.choices.indexOf(selectedChoice)];

    const correctLetter=
        LETTERS[q.choices.indexOf(correctChoice)];

    return `

        <div
            class="feedback show ${correct
                ?"correct-feedback"
                :"wrong-feedback"}"
            role="status"
            aria-live="polite"
        >

            <div class="explain-title">
                ${correct ? "✓ Correct!" : "✗ Incorrect"}
            </div>

            <div>
                Your answer:
                <strong>${selectedLetter}. ${escapeHTML(selectedChoice.text)}</strong>
            </div>

            <div>
                Correct answer:
                <strong>${correctLetter}. ${escapeHTML(correctChoice.text)}</strong>
            </div>

            <div style="margin-top:10px">
                <strong>Why?</strong>
                ${escapeHTML(q.e)}
            </div>

            ${
                !correct
                ? `
                <div style="margin-top:10px">
                    <strong>Remember:</strong>
                    ${escapeHTML(q.rule)}
                </div>
                `
                :""
            }

        </div>

        <div class="next-wrap">

            <button
                type="button"
                class="main-btn"
                onclick="nextQuestion()"
            >
                ${
                    currentQuestionIndex===
                    QUESTIONS_PER_ROUND-1
                    ? "Finish Round →"
                    : "Next Question →"
                }
            </button>

        </div>
    `;
}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    if(selected===null) return;

    if(currentQuestionIndex<
        QUESTIONS_PER_ROUND-1){

        currentQuestionIndex++;

        selected=
            roundAnswers[currentQuestionIndex] ?? null;

        saveProgress();

        showQuestion();

    }else{

        endRound();
    }
}


/* =========================================================
   END ROUND
========================================================= */

function endRound(){

    const existing=
        progress.completedRounds.find(
            r=>r.round===currentRound
        );

    const record={
        round:currentRound,
        correct:roundScore,
        total:QUESTIONS_PER_ROUND,
        percentage:
            Math.round(
                (roundScore/QUESTIONS_PER_ROUND)*100
            ),
        completedAt:new Date().toISOString()
    };

    if(existing){

        Object.assign(existing,record);

    }else{

        progress.completedRounds.push(record);
    }

    progress.completedRounds.sort(
        (a,b)=>a.round-b.round
    );

    progress.activeRound=null;
    progress.activeQuestionIndex=0;
    progress.activeRoundScore=0;
    progress.activeRoundQuestions=[];
    progress.activeRoundAnswers=[];

    progress.totalCorrect=
        progress.completedRounds.reduce(
            (sum,r)=>sum+r.correct,
            0
        );

    const completedCount=
        progress.completedRounds.length;

    if(completedCount>=TOTAL_ROUNDS){

        progress.quizCompleted=true;

        saveProgress();

        showFinalResult();

    }else{

        progress.currentRound=currentRound+1;

        saveProgress();

        showRoundResult();
    }
}

    }

/* =========================================================
   SOUND
========================================================= */

let audioContext=null;

function beep(type){

    if(!soundEnabled) return;

    try{

        if(!audioContext){
            audioContext=
                new (window.AudioContext ||
                window.webkitAudioContext)();
        }

        if(audioContext.state==="suspended"){
            audioContext.resume().catch(()=>{});
        }

        const oscillator=
            audioContext.createOscillator();

        const gain=
            audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.type="sine";

        oscillator.frequency.value=
            type==="correct"
            ? 700
            : 180;

        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .07,
            audioContext.currentTime+.01
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime+.16
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime+.17
        );

    }catch(error){}
}

function toggleSound(){

    soundEnabled=!soundEnabled;

    document.getElementById("soundBtn").textContent=
        soundEnabled
        ? "🔊 Sound"
        : "🔇 Sound";

    saveSettings();

/* =========================================================
   CONFETTI
========================================================= */

function confetti(){

    const canvas=
        document.getElementById("confettiCanvas");

    const ctx=canvas.getContext("2d");

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    canvas.style.display="block";

    const colors=[
        "#6ee7ff",
        "#8b5cf6",
        "#36e39b",
        "#ffd166",
        "#ff647c",
        "#ffffff"
    ];

    const pieces=
        Array.from({length:130},()=>({

            x:Math.random()*canvas.width,

            y:-20-Math.random()*canvas.height*.4,

            size:5+Math.random()*7,

            speed:2+Math.random()*4,

            rotation:Math.random()*Math.PI,

            rotationSpeed:
                (Math.random()-.5)*.2,

            color:
                colors[
                    Math.floor(
                        Math.random()*colors.length
                    )
                ]

        }));

    let frame=0;

    function draw(){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        pieces.forEach(p=>{

            p.y+=p.speed;

            p.rotation+=p.rotationSpeed;

            ctx.save();

            ctx.translate(p.x,p.y);

            ctx.rotate(p.rotation);

            ctx.fillStyle=p.color;

            ctx.fillRect(
                -p.size/2,
                -p.size/2,
                p.size,
                p.size
            );

            ctx.restore();
        });

        frame++;

        if(frame<180){

            requestAnimationFrame(draw);

        }else{

            canvas.style.display="none";
        }
    }

    draw();
}

/* =========================================================
   IMPORT
========================================================= */

function importProgress(event){

    const file=
        event.target.files[0];

    if(!file) return;

    const reader=
        new FileReader();

    reader.onload=function(){

        try{

            const data=
                JSON.parse(reader.result);

            const imported=
                data.progress || data;

            if(!imported ||
               typeof imported!=="object"){

                throw new Error(
                    "Invalid progress file."
                );
            }

            if(!Array.isArray(imported.completedRounds)){

                throw new Error(
                    "Invalid completed rounds."
                );
            }

            if(
                imported.activeRound!==null &&
                (
                    imported.activeRound<1 ||
                    imported.activeRound>TOTAL_ROUNDS
                )
            ){

                throw new Error(
                    "Invalid active round."
                );
            }

            progress={
                ...DEFAULT_PROGRESS,
                ...imported,
                version:3
            };

            saveProgress();

            alert(
                "Progress imported successfully."
            );

            currentRound=
                progress.activeRound ||
                progress.currentRound ||
                1;

            if(progress.quizCompleted){

                showFinalResult();

            }else{

                startRound(currentRound);
            }

        }catch(error){

            alert(
                "Import failed: "+
                error.message
            );
        }

        event.target.value="";
    };

    reader.readAsText(file);
}

    progress={

    currentRound=1;
    roundQuestions=[];
    roundAnswers=[];
    currentQuestionIndex=0;
    roundScore=0;
    selected=null;

    startRound(1);
}


/* =========================================================
   HOME
========================================================= */

function goHome(){

    saveProgress();

    window.location.href="index.html";
}


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   AUTO SAVE
========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{
        saveProgress();
    }
);

document.addEventListener(
    "visibilitychange",
    ()=>{
        if(document.visibilityState==="hidden"){
            saveProgress();
        }
    }
);


/* =========================================================
   INITIALIZATION
========================================================= */

loadProgress();

document.getElementById("soundBtn").textContent=
    soundEnabled
    ? "🔊 Sound"
    : "🔇 Sound";

if(bankErrors.length){

    showBankError();

}else{

    document.getElementById("warningArea").innerHTML="";

    if(
        progress.quizCompleted &&
        progress.completedRounds.length>=TOTAL_ROUNDS
    ){

        currentRound=TOTAL_ROUNDS;

        showFinalResult();

    }else{

        currentRound=
            progress.activeRound ||
            progress.currentRound ||
            1;

        startRound(currentRound);
    }
}

</script>

</body>
</html>
