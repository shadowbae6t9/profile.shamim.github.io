.subtitle{

}

========================= */

}

    border-radius:17px;

.primary-btn,

    color:white;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    transition:
        transform .2s ease,

}

.primary-btn{
    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #06b6d4

.secondary-btn{
    background:

}

.danger-btn{

}

.primary-btn:hover,
.secondary-btn:hover,
.danger-btn:hover{

    filter:brightness(1.1);
}

.primary-btn:active,
.secondary-btn:active,
.danger-btn:active{
    transform:scale(.98);
}

.button-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:12px;
}

/* =========================
   SAVED PROGRESS
========================= */

.saved-progress{
    margin-top:22px;

    padding:18px;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(139,92,246,.15),
            rgba(6,182,212,.12)
        );

    border:1px solid rgba(139,92,246,.35);
}

.saved-progress h3{
    margin-bottom:10px;
}

.saved-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.saved-stat{
    padding:12px;
    border-radius:14px;
    background:rgba(255,255,255,.06);
}

.saved-stat span{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-bottom:3px;
}

.saved-stat strong{
    font-size:17px;
}

/* =========================
   PROGRESS
========================= */

.progress-wrap{
    background:rgba(255,255,255,.10);
    border:1px solid var(--border);

    border-radius:20px;

    padding:15px;

    margin-bottom:18px;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

.progress-info{
    display:flex;
    justify-content:space-between;
    gap:10px;

    font-size:13px;

    margin-bottom:9px;

    color:var(--muted);
}

.progress-bar{
    height:10px;

    background:rgba(255,255,255,.12);

    border-radius:99px;

    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;

    border-radius:99px;

    background:
        linear-gradient(
            90deg,
            #8b5cf6,
            #06b6d4,
            #22c55e
        );

    transition:width .5s ease;
}

/* =========================
   QUIZ
========================= */

.round-title{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;

    margin-bottom:20px;
}

.round-title h2{
    font-size:20px;
}

.question-count{
    color:var(--muted);
    font-size:13px;
}

.question-box{
    animation:questionIn .4s ease;
}

.question{
    font-size:clamp(19px,4vw,26px);

    line-height:1.6;

    margin-bottom:12px;
}

.bangla{
    color:#c4b5fd;

    font-size:14px;

    line-height:1.55;

    margin-bottom:23px;

    padding:12px 14px;

    border-left:3px solid var(--accent);

    background:rgba(139,92,246,.08);

    border-radius:8px;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    width:100%;

    text-align:left;

    padding:17px;

    border-radius:17px;

    border:1px solid rgba(255,255,255,.18);

    background:rgba(255,255,255,.07);

    color:white;

    cursor:pointer;

    font-size:16px;

    transition:
        transform .2s ease,
        background .2s ease,
        border .2s ease;
}

.option:hover:not(:disabled){
    transform:translateY(-2px);

    background:rgba(255,255,255,.13);
}

.option:disabled{
    cursor:default;
}

.option.selected{
    border-color:#fff;

    background:
        linear-gradient(
            90deg,
            #8b5cf655,
            #06b6d455
        );

    animation:selectPop .3s ease;
}

.option.correct{
    border-color:var(--success);

    background:
        rgba(34,197,94,.20);
}

.option.wrong{
    border-color:var(--danger);

    background:
        rgba(239,68,68,.20);
}

.option-letter{
    display:inline-flex;

    width:32px;
    height:32px;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(255,255,255,.12);

    margin-right:10px;

    font-weight:bold;
}

/* =========================
   NEXT
========================= */

.next-btn{

    border:0;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #06b6d4
        );

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.next-btn:hover:not(:disabled){
    transform:translateY(-2px);
    filter:brightness(1.1);
}

.next-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.result-icon{
    font-size:70px;

    margin-bottom:10px;
}

.score{
    font-size:58px;

    font-weight:900;

    margin:10px 0;
}

.result-message{
    color:var(--muted);

            #22c55e22,
            #06b6d422

    margin-bottom:20px;

.result-box.warning{
    background:
        rgba(245,158,11,.10);

    border-color:
        rgba(245,158,11,.35);
}

.result-box strong{
    color:white;
}

.explanations{

    margin-top:25px;
}

.explanation{
    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.12);

    border-radius:18px;

    padding:17px;

    margin-bottom:13px;
}

.explanation.correct{
    border-left:5px solid var(--success);
}

.explanation.wrong{
    border-left:5px solid var(--danger);
}

.explanation-question{
    font-weight:700;

    line-height:1.5;

    margin-bottom:8px;
}

.explanation-bangla{
    color:#c4b5fd;

    font-size:13px;

    line-height:1.5;

    margin-bottom:10px;
}

.answer{
    color:#86efac;

    font-weight:700;

    margin-bottom:7px;
}

.explain{
    color:var(--muted);

    line-height:1.6;

    font-size:14px;

========================= */

.final-stat-grid{

    grid-template-columns:

    gap:12px;

    margin:20px 0;
}

.final-stat{
    padding:16px;

    border-radius:16px;

    background:rgba(255,255,255,.07);

    border:1px solid var(--border);
}

.final-stat span{
    display:block;

    color:var(--muted);

    font-size:13px;

    margin-bottom:5px;
}

.final-stat strong{
    font-size:24px;
}

.level{
    font-size:24px;

    font-weight:800;
}

.stars{
    font-size:25px;

    margin-top:7px;
}

/* =========================
   CELEBRATION
========================= */

.celebration{
    position:fixed;

    inset:0;

    pointer-events:none;

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:999;
}

.celebration-text{
    font-size:
        clamp(32px,8vw,72px);

    font-weight:900;

    text-align:center;

    opacity:0;

    transform:scale(.5);
}

.celebration.show .celebration-text{
    animation:
        celebrate 1.5s ease forwards;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes questionIn{
    from{
        opacity:0;
        transform:translateX(20px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }
}

@keyframes selectPop{
    0%{
        transform:scale(.97);
    }

    60%{
        transform:scale(1.02);
    }

    100%{
        transform:scale(1);
    }
}

@keyframes resultIn{
    from{
        opacity:0;
        transform:scale(.95);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes celebrate{
    0%{
        opacity:0;
        transform:
            scale(.5)
            rotate(-5deg);
    }

    20%{
        opacity:1;
        transform:
            scale(1.1)
            rotate(2deg);
    }

    70%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(1.3);
    }
}

/* =========================
   HIDDEN
========================= */

.hidden{
    display:none!important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        padding:12px;
    }

    .card{
        padding:18px;
        border-radius:22px;
    }

    .features{
        grid-template-columns:1fr;
    }

    .saved-info{
        grid-template-columns:1fr;
    }

    .button-row{
        grid-template-columns:1fr;
    }

    .final-stat-grid{
        grid-template-columns:1fr;
    }

    .option{
        padding:14px;

        font-size:15px;
    }

    .question{
        font-size:19px;
    }
}
</style>
</head>

/* ============================================================
   QUIZ STATE
============================================================ */

let state = createFreshState();

function createFreshState(){

    return {

        started:false,

        currentQuestion:0,

        answers:[],

        completedRounds:[],

        totalCorrect:0,

        totalAnswered:0,

        bestScore:0,

        completed:false,

        startedAt:null,

        completedAt:null

    };

}

/* ============================================================
   SAVE
============================================================ */

function saveProgress(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(state)
        );

    }catch(error){

        console.warn(
            "Progress could not be saved:",
            error
        );

    }

}

/* ============================================================
   LOAD
============================================================ */

function loadProgress(){

    try{

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(!raw){
            return null;
        }

        const saved =
            JSON.parse(raw);

        if(
            !saved ||
            typeof saved !== "object"
        ){
            return null;
        }

        if(
            !Array.isArray(saved.answers) ||
            !Array.isArray(saved.completedRounds)
        ){
            return null;
        }

        return {
            ...createFreshState(),
            ...saved
        };

    }catch(error){

        console.warn(
            "Saved progress could not be loaded:",
            error
        );

        return null;
    }
}

/* ============================================================
   CLEAR PROGRESS
============================================================ */

function clearProgress(){

    const confirmed =
        confirm(
            "Reset all saved quiz progress?\n\n" +
            "This will permanently remove the current " +
            "score, answers, completed rounds and achievements."
        );

    if(!confirmed){
        return;
    }

    localStorage.removeItem(
        STORAGE_KEY
    );

    state =
        createFreshState();

    renderStart();

}

/* ============================================================
   START NEW QUIZ
============================================================ */

function startNewQuiz(){

    const hasProgress =
        state.started &&
        !state.completed &&
        state.totalAnswered > 0;

    if(hasProgress){

        const confirmed =
            confirm(
                "You already have saved progress.\n\n" +
                "Starting a new quiz will erase that progression.\n\n" +
                "Continue?"
            );

        if(!confirmed){
            return;
        }

    }

    state =
        createFreshState();

    state.started = true;

    state.startedAt =
        new Date().toISOString();

    saveProgress();

    renderQuestion();

}

/* ============================================================
   CONTINUE
============================================================ */

function continueQuiz(){

    const saved =
        loadProgress();

    if(!saved){
        startNewQuiz();
        return;
    }

    state =
        saved;

    if(state.completed){

        showFinalResult();

    }else{

        renderQuestion();

    }

}

/* ============================================================
   QUESTION INDEX
============================================================ */

function getCurrentQuestion(){

    return questions[
        state.currentQuestion
    ];
}

/* ============================================================
   ROUND NUMBER
============================================================ */

function getRoundNumber(){

    return Math.floor(
        state.currentQuestion / 15
    ) + 1;

}

/* ============================================================
   QUESTION NUMBER IN ROUND
============================================================ */

function getQuestionNumberInRound(){

    return (
        state.currentQuestion % 15
    ) + 1;

}

/* ============================================================
   OVERALL PROGRESS
============================================================ */

function getProgressPercentage(){

    return (
        state.currentQuestion / 150
    ) * 100;

}

/* ============================================================

============================================================ */

function renderQuestion(){

        showFinalResult();

        return;
    }

    const q =
        getCurrentQuestion();

    if(!q){

        finishQuiz();

        return;
    }

    const app =
        document.getElementById("app");

    const round =
        getRoundNumber();

    const questionNumber =
        getQuestionNumberInRound();

    const progress =
        getProgressPercentage();

        state.answers[
            state.currentQuestion
        ];

        savedAnswer !== undefined &&
        savedAnswer !== null;

    app.innerHTML = `

        <div class="progress-wrap">

}

/* ============================================================
   SELECT ANSWER
============================================================ */

function selectAnswer(optionIndex){

    if(
        state.answers[
            state.currentQuestion
        ]
    ){

        return;
    }

    const q =
        getCurrentQuestion();

    const selected =
        q.options[optionIndex];

    const correct =
        selected === q.answer;

    state.answers[
        state.currentQuestion
    ] = {

        selected:selected,

        correct:correct

    };

    state.totalAnswered++;

    if(correct){

        state.totalCorrect++;

    }

    state.bestScore =
        Math.max(
            state.bestScore,
            state.totalCorrect
        );

    saveProgress();

    renderQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

/* ============================================================
   NEXT QUESTION
============================================================ */

function nextQuestion(){

    const answer =
        state.answers[
            state.currentQuestion
        ];

    if(!answer){

        return;
    }

    const questionNumber =
        getQuestionNumberInRound();

    if(questionNumber === 15){

        completeCurrentRound();

        return;
    }

    state.currentQuestion++;

    saveProgress();

    renderQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

/* ============================================================
   COMPLETE ROUND
============================================================ */

function completeCurrentRound(){

    const round =
        getRoundNumber();

    const start =
        (round - 1) * 15;

    const end =
        start + 15;

    let roundCorrect = 0;

    for(
        let i=start;
        i<end;
        i++
    ){

        if(
            state.answers[i] &&
            state.answers[i].correct
        ){

            roundCorrect++;

        }

    }

    if(
        !state.completedRounds.includes(round)
    ){

        state.completedRounds.push(
            round
        );

    }

    saveProgress();

    showRoundResult(
        round,
        roundCorrect
    );

}

/* ============================================================

function goToNextRound(round){

    state.currentQuestion =

    saveProgress();

    renderQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

/* ============================================================
   FINISH QUIZ
============================================================ */

function finishQuiz(){

    state.currentQuestion = 150;

    state.completed = true;

    state.completedAt =
        new Date().toISOString();

    state.bestScore =
        Math.max(
            state.bestScore,
            state.totalCorrect
        );

    saveProgress();

    celebrate();

    showFinalResult();

}

/* ============================================================
   LEVEL
============================================================ */

function getLevel(score){

    if(score >= 135){
        return "Master";
    }

    if(score >= 120){
        return "Advanced";
    }

    if(score >= 105){
        return "Strong";
    }

    if(score >= 90){
        return "Growing";
    }

    return "Keep Practising";

}

/* ============================================================
   STARS
============================================================ */

function getStars(score){

    if(score >= 135){
        return "⭐⭐⭐⭐⭐";
    }

    if(score >= 120){
        return "⭐⭐⭐⭐";
    }

    if(score >= 105){
        return "⭐⭐⭐";
    }

    if(score >= 90){
        return "⭐⭐";
    }

    return "⭐";

}

                Overall Accuracy:
                <strong>
                    ${percentage}%
                </strong>

            </p>

            <div class="final-stat-grid">

                <div class="final-stat">

                    <span>
                        Correct Answers
                    </span>

                    <strong>
                        ${score}
                    </strong>

                </div>

                <div class="final-stat">

                    <span>
                        Wrong Answers
                    </span>

                    <strong>
                        ${150-score}
                    </strong>

                </div>

                <div class="final-stat">

                    <span>
                        Rounds Completed
                    </span>

                    <strong>
                        ${state.completedRounds.length}/10
                    </strong>

                </div>

                <div class="final-stat">

                    <span>
                        Best Score
                    </span>

                    <strong>
                        ${state.bestScore}/150
                    </strong>

                </div>

            </div>

            <div class="result-box">

                <div class="level">
                    Level: ${level}
                </div>

                <div class="stars">
                    ${stars}
                </div>

            </div>

            <div class="result-box">

                <strong>
                    💾 Progress Saved
                </strong>

                <p
                    style="
                        margin-top:8px;
                        color:var(--muted);
                        line-height:1.6;
                    ">

                    Your achievement and best score
                    are stored in this browser.

                    You can safely return later.

                </p>

            </div>

            <button
                class="primary-btn"
                onclick="startNewQuiz()">

                🔄 Start New 150-Question Quiz

            </button>

            <button
                class="danger-btn"
                style="margin-top:12px"
                onclick="clearProgress()">

                🗑 Delete Saved Progress

            </button>

        </div>

    `;

}

/* ============================================================
   CELEBRATION
============================================================ */

function celebrate(){

    const box =
        document.getElementById(
            "celebration"
        );

    box.classList.remove("show");

    void box.offsetWidth;

    box.classList.add("show");

    setTimeout(
        ()=>{
            box.classList.remove("show");
        },
        1600
    );

}

/* ============================================================
   INITIAL LOAD
============================================================ */

const existingProgress =
    loadProgress();

if(existingProgress){

    state =
        existingProgress;

}

renderStart();

</script>
