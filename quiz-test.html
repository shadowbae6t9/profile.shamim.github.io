<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HSC Completing Sentence | 150 Question Quiz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg1:#0f172a;
    --bg2:#312e81;
    --card:rgba(255,255,255,.10);
    --border:rgba(255,255,255,.18);
    --text:#ffffff;
    --muted:#cbd5e1;
    --success:#22c55e;
    --danger:#ef4444;
    --accent:#8b5cf6;
    --accent2:#06b6d4;
}

body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    color:var(--text);
    background:
        radial-gradient(circle at 10% 10%,#7c3aed55,transparent 30%),
        radial-gradient(circle at 90% 20%,#06b6d455,transparent 30%),
        radial-gradient(circle at 50% 90%,#ec489955,transparent 35%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

header{
    text-align:center;
    margin:15px 0 25px;
}

.badge{
    display:inline-block;
    padding:7px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    border:1px solid var(--border);
    font-size:13px;
    margin-bottom:12px;
}

h1{
    font-size:clamp(28px,6vw,48px);
    line-height:1.1;
    margin-bottom:10px;
}

.subtitle{
    color:var(--muted);
    font-size:15px;
}

.progress-wrap{
    background:rgba(255,255,255,.10);
    border:1px solid var(--border);
    border-radius:20px;
    padding:15px;
    margin-bottom:18px;
    backdrop-filter:blur(15px);
}

.progress-info{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    margin-bottom:9px;
    color:var(--muted);
}

.progress-bar{
    height:10px;
    background:rgba(255,255,255,.12);
    border-radius:99px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,#8b5cf6,#06b6d4,#22c55e);
    transition:width .5s ease;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:28px;
    padding:25px;
    backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.round-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.round-title h2{
    font-size:20px;
}

.question-count{
    color:var(--muted);
    font-size:13px;
}

.question-box{
    animation:questionIn .45s ease;
}

@keyframes questionIn{
    from{
        opacity:0;
        transform:translateX(25px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

.question{
    font-size:clamp(19px,4vw,26px);
    line-height:1.55;
    margin-bottom:25px;
}

.blank{
    display:inline-block;
    min-width:90px;
    border-bottom:3px solid #fff;
    color:transparent;
    vertical-align:middle;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    width:100%;
    text-align:left;
    padding:17px;
    border-radius:17px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.07);
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:
        transform .2s ease,
        background .2s ease,
        border .2s ease;
    position:relative;
    overflow:hidden;
}

.option:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.13);
}

.option.selected{
    animation:selectPop .35s ease;
    border-color:#fff;
    background:linear-gradient(90deg,#8b5cf655,#06b6d455);
}

@keyframes selectPop{
    0%{transform:scale(.97)}
    60%{transform:scale(1.02)}
    100%{transform:scale(1)}
}

.option-letter{
    display:inline-flex;
    width:32px;
    height:32px;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    margin-right:10px;
    font-weight:bold;
}

.next-btn,
.start-btn,
.restart-btn{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:0;
    border-radius:16px;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.next-btn:hover,
.start-btn:hover,
.restart-btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.1);
}

.next-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
    transform:none;
}

.hidden{
    display:none!important;
}

/* Result */

.result{
    text-align:center;
    animation:resultIn .6s ease;
}

@keyframes resultIn{
    from{
        opacity:0;
        transform:scale(.9);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.result-icon{
    font-size:70px;
    margin-bottom:10px;
}

.score{
    font-size:58px;
    font-weight:900;
    margin:10px 0;
}

.result-message{
    color:var(--muted);
    margin-bottom:20px;
}

.perfect{
    padding:18px;
    border-radius:18px;
    background:linear-gradient(135deg,#22c55e33,#06b6d433);
    border:1px solid #22c55e66;
    margin-bottom:20px;
}

.explanations{
    text-align:left;
    margin-top:25px;
}

.explanation{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:17px;
    margin-bottom:13px;
}

.explanation.correct{
    border-left:5px solid var(--success);
}

.explanation.wrong{
    border-left:5px solid var(--danger);
}

.explanation-question{
    font-weight:700;
    line-height:1.5;
    margin-bottom:8px;
}

.answer{
    color:#86efac;
    font-weight:700;
    margin-bottom:7px;
}

.explain{
    color:var(--muted);
    line-height:1.55;
    font-size:14px;
}

.progression{
    margin-top:20px;
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,.07);
}

.level{
    font-size:22px;
    font-weight:800;
}

.stars{
    font-size:25px;
    margin-top:7px;
}

/* Start */

.start-screen{
    text-align:center;
    animation:questionIn .5s ease;
}

.start-screen h2{
    font-size:30px;
    margin-bottom:15px;
}

.features{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin:25px 0;
}

.feature{
    padding:15px;
    border-radius:16px;
    background:rgba(255,255,255,.07);
    border:1px solid var(--border);
    color:var(--muted);
}

.feature strong{
    display:block;
    color:white;
    font-size:20px;
    margin-bottom:4px;
}

.celebration{
    position:fixed;
    inset:0;
    pointer-events:none;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.celebration-text{
    font-size:clamp(32px,8vw,72px);
    font-weight:900;
    text-align:center;
    opacity:0;
    transform:scale(.5);
}

.celebration.show .celebration-text{
    animation:celebrate 1.5s ease forwards;
}

@keyframes celebrate{
    0%{
        opacity:0;
        transform:scale(.5) rotate(-5deg);
    }
    20%{
        opacity:1;
        transform:scale(1.1) rotate(2deg);
    }
    70%{
        opacity:1;
        transform:scale(1);
    }
    100%{
        opacity:0;
        transform:scale(1.3);
    }
}

@media(max-width:600px){
    body{
        padding:12px;
    }

    .card{
        padding:18px;
        border-radius:22px;
    }

    .features{
        grid-template-columns:1fr;
    }

    .option{
        padding:14px;
        font-size:15px;
    }
}
</style>
</head>

/* ============================================================
   STATE
   ============================================================ */

let currentRound = 0;
let currentQuestion = 0;
let roundQuestions = [];
let roundAnswers = [];
let totalCorrect = 0;
let totalAnswered = 0;
let roundScore = 0;

/* ============================================================
   HELPERS
   ============================================================ */

function shuffle(array){
    return [...array].sort(() => Math.random() - 0.5);
}

function startQuiz(){

    currentRound = 0;
    currentQuestion = 0;
    totalCorrect = 0;
    totalAnswered = 0;

    startRound();
}

function startRound(){

    if(currentRound >= 10){
        showFinalResult();
        return;
    }

    currentQuestion = 0;
    roundScore = 0;
    roundAnswers = [];

    /*
      Pick 15 random questions from the full 150 bank.
      Questions are not repeated within the same round.
    */
    roundQuestions = shuffle(questions).slice(0,15);

    renderQuiz();
}

function renderQuiz(){

    const app = document.getElementById("app");

    const progress =
        ((currentRound * 15 + currentQuestion) / 150) * 100;

    app.innerHTML = `

        <div class="progress-wrap">

            <div class="progress-info">
                <span>
                    Overall Progress
                </span>

                <span>
                    ${currentRound * 15 + currentQuestion} / 150
                </span>
            </div>

            <div class="progress-bar">
                <div
                    class="progress-fill"
                    style="width:${progress}%">
                </div>
            </div>

        </div>

        <div class="card">

            <div class="round-title">

                <h2>
                    Round ${currentRound + 1}
                </h2>

                <div class="question-count">
                    Question ${currentQuestion + 1} / 15
                </div>

            </div>

            <div
                id="questionBox"
                class="question-box">
            </div>

        </div>
    `;

    renderQuestion();
}

function renderQuestion(){

    const q = roundQuestions[currentQuestion];

    const box = document.getElementById("questionBox");

    /*
      Create plausible distractors from other questions'
      answers. They remain grammar-related.
    */

    let distractors = shuffle(
        questions
        .filter(item => item.answer !== q.answer)
        .map(item => item.answer)
    ).slice(0,3);

    let options = shuffle([
        q.answer,
        ...distractors
    ]);

    box.innerHTML = `

        <div class="question">
            ${q.q}
        </div>

        <div class="options">

            ${options.map((option,index)=>`

                <button
                    class="option"
                    onclick="selectAnswer(this, '${escapeQuotes(option)}')">

                    <span class="option-letter">
                        ${String.fromCharCode(65+index)}
                    </span>

                    ${option}

                </button>

            `).join("")}

        </div>

        <button
            id="nextBtn"
            class="next-btn"
            disabled
            onclick="nextQuestion()">

            ${currentQuestion === 14
                ? "Finish 15 Questions →"
                : "Next Question →"}

        </button>
    `;
}

function escapeQuotes(text){
    return text
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}

function selectAnswer(button, selected){

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(btn=>{
        btn.disabled = true;
    });

    button.classList.add("selected");

    const q = roundQuestions[currentQuestion];

    const correct =
        selected === q.answer;

    if(correct){
        roundScore++;
        totalCorrect++;
    }

    totalAnswered++;

    roundAnswers.push({
        question:q,
        selected:selected,
        correct:correct
    });

    document.getElementById("nextBtn").disabled = false;
}

function nextQuestion(){

    if(currentQuestion < 14){

        currentQuestion++;

        renderQuestion();

    }else{

        showRoundResult();

    }
}

/* ============================================================
   ROUND RESULT
   ============================================================ */

function showRoundResult(){

    const app = document.getElementById("app");

    const perfect = roundScore >= 12;

    if(perfect){
        celebrate();
    }

    const percentage =
        Math.round((roundScore / 15) * 100);

    app.innerHTML = `

        <div class="card result">

            <div class="result-icon">
                ${perfect ? "🏆" : "📚"}
            </div>

            <h2>
                ${perfect
                    ? "Perfect Progress!"
                    : "Round Complete!"}
            </h2>

            <div class="score">
                ${roundScore}/15
            </div>

            <p class="result-message">
                ${percentage}% correct
            </p>

            ${
                perfect
                ?
                `
                <div class="perfect">

                    <div class="level">
                        🌟 PERFECT GROWING!
                    </div>

                    <p>
                        You scored 12 or more correct answers.
                        Your level has progressed!
                    </p>

                    <div class="stars">
                        ⭐ ⭐ ⭐ ⭐ ⭐
                    </div>

                </div>
                `
                :
                `
                <div class="perfect">

                    Keep practising!
                    You need <strong>12+</strong> correct answers
                    for Perfect Progression.

                </div>
                `
            }

            <button
                class="next-btn"
                onclick="showAnswers()">

                View Answers & Explanations →

            </button>

        </div>
    `;
}

/* ============================================================
   ANSWERS + EXPLANATIONS
   ============================================================ */

function showAnswers(){

    const app = document.getElementById("app");

    const perfect = roundScore >= 12;

    app.innerHTML = `

        <div class="card">

            <div class="result">

                <div class="result-icon">
                    ${perfect ? "🎉" : "📝"}
                </div>

                <h2>
                    Round ${currentRound + 1} —
                    Answers & Explanations
                </h2>

                <div class="score">
                    ${roundScore}/15
                </div>

            </div>

            <div class="explanations">

                ${roundAnswers.map((item,index)=>`

                    <div class="
                        explanation
                        ${item.correct ? "correct" : "wrong"}
                    ">

                        <div class="explanation-question">

                            ${index+1}.
                            ${item.question.q}

                        </div>

                        <div class="answer">

                            Correct Answer:
                            ${item.question.answer}

                        </div>

                        <div class="explain">

                            <strong>Rule:</strong>
                            ${item.question.rule}

                            <br><br>

                            <strong>Explanation:</strong>
                            ${item.question.explain}

                            <br><br>

                            <strong>Your Answer:</strong>
                            ${item.selected}

                        </div>

                    </div>

                `).join("")}

            </div>

            <button
                class="next-btn"
                onclick="nextRound()">

                ${
                    currentRound === 9
                    ? "Complete All 150 Questions →"
                    : "Start Next 15 Questions →"
                }

            </button>

        </div>
    `;
}

function nextRound(){

    currentRound++;

    if(currentRound >= 10){

        showFinalResult();

    }else{

        startRound();

    }
}

/* ============================================================
   FINAL RESULT
   ============================================================ */

function showFinalResult(){

    const app = document.getElementById("app");

    const percentage =
        Math.round((totalCorrect / totalAnswered) * 100);

    let level;

    if(totalCorrect >= 135){
        level = "Master";
    }else if(totalCorrect >= 120){
        level = "Advanced";
    }else if(totalCorrect >= 105){
        level = "Strong";
    }else if(totalCorrect >= 90){
        level = "Growing";
    }else{
        level = "Keep Practising";
    }

    app.innerHTML = `

        <div class="card result">

            <div class="result-icon">
                🏆
            </div>

            <h2>
                150 Questions Completed!
            </h2>

            <div class="score">
                ${totalCorrect}/150
            </div>

            <p class="result-message">
                Overall Accuracy: ${percentage}%
            </p>

            <div class="progression">

                <div class="level">
                    Level: ${level}
                </div>

                <div class="stars">
                    ${
                        totalCorrect >= 135
                        ? "⭐⭐⭐⭐⭐"
                        : totalCorrect >= 120
                        ? "⭐⭐⭐⭐"
                        : totalCorrect >= 105
                        ? "⭐⭐⭐"
                        : totalCorrect >= 90
                        ? "⭐⭐"
                        : "⭐"
                    }
                </div>

            </div>

            <button
                class="restart-btn"
                onclick="startQuiz()">

                🔄 Start Again — New Question Order

            </button>

        </div>
    `;
}
