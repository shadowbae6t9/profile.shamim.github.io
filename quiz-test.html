<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English Grammar Quiz - Sentence Completion</title>

<style>

:root {
    --primary: #8b5cf6;
    --secondary: #ec4899;
    --success: #22c55e;
    --error: #ef4444;
    --bg: #080812;
    --card: rgba(255,255,255,0.08);
    --text: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top left,
            #3b0764,
            transparent 40%
        ),
        radial-gradient(
            circle at bottom right,
            #831843,
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #050509,
            #12051c,
            #090b20
        );

    color: var(--text);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    overflow-x: hidden;
}


/* MAIN CARD */

.quiz-container {

    width: 100%;
    max-width: 680px;

    padding: 28px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.15);

    border-radius: 24px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 25px 70px rgba(0,0,0,0.45),
        0 0 40px rgba(139,92,246,0.12);

    animation:
        cardEnter 0.8s ease;
}


@keyframes cardEnter {

    from {
        opacity: 0;
        transform: translateY(30px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* HEADER */

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {

    font-size: 1.8rem;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #d8b4fe,
            #f9a8d4
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    margin-bottom: 8px;
}

.header p {
    color: rgba(255,255,255,.6);
    font-size: .9rem;
}


/* PARTICIPANT SCREEN */

.participant-screen {
    text-align: center;
}

.participant-screen h2 {
    margin-bottom: 10px;
}

.participant-screen p {
    color: rgba(255,255,255,.65);
    margin-bottom: 25px;
}

.name-input {

    width: 100%;

    padding: 15px;

    border-radius: 12px;

    border:
        1px solid rgba(255,255,255,.18);

    background:
        rgba(0,0,0,.25);

    color: white;

    outline: none;

    font-size: 1rem;

    margin-bottom: 15px;

    text-align: center;
}

.name-input:focus {

    border-color: #c084fc;

    box-shadow:
        0 0 20px rgba(192,132,252,.2);
}


/* BUTTON */

.start-quiz-btn {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #ec4899
        );

    color: white;

    font-weight: 700;

    font-size: 1rem;

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.start-quiz-btn:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 10px 30px rgba(236,72,153,.3);
}

.start-quiz-btn:active {

    transform:
        scale(.96);
}


/* QUIZ */

#quiz-box {
    display: none;
}


/* PROGRESS */

.progress-bar-container {

    width: 100%;

    height: 9px;

    background:
        rgba(255,255,255,.1);

    border-radius: 10px;

    overflow: hidden;

    margin-bottom: 18px;
}

.progress-bar {

    height: 100%;

    width: 0%;

    background:
        linear-gradient(
            90deg,
            #8b5cf6,
            #ec4899
        );

    border-radius: 10px;

    transition:
        width .4s ease;
}


/* INFO */

.quiz-info {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 12px;

    font-size: .85rem;

    color:
        rgba(255,255,255,.6);
}


/* QUESTION */

.question-text {

    font-size: 1.3rem;

    font-weight: 700;

    line-height: 1.5;

    margin-bottom: 22px;

}


/* QUESTION ANIMATION */

.question-enter {

    animation:
        questionEnter .45s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes questionEnter {

    from {
        opacity: 0;
        transform:
            translateX(35px)
            scale(.98);
    }

    to {
        opacity: 1;
        transform:
            translateX(0)
            scale(1);
    }

}


/* OPTIONS */

.options-list {

    list-style: none;

    margin-bottom: 18px;
}

.option-btn {

    width: 100%;

    padding: 15px;

    margin-bottom: 11px;

    border-radius: 13px;

    border:
        1px solid rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.055);

    color: white;

    text-align: left;

    font-size: .98rem;

    cursor: pointer;

    transition:
        transform .2s ease,
        background .2s ease,
        border .2s ease;

}

.option-btn:hover:not(:disabled) {

    transform:
        translateX(5px);

    background:
        rgba(255,255,255,.12);

    border-color:
        rgba(192,132,252,.7);
}


/* CORRECT */

.option-btn.correct {

    background:
        linear-gradient(
            135deg,
            rgba(34,197,94,.28),
            rgba(22,163,74,.18)
        );

    border-color:
        #22c55e;

    color:
        #bbf7d0;

    animation:
        correctAnswer .65s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes correctAnswer {

    0% {
        transform:
            scale(.92);
    }

    35% {
        transform:
            scale(1.04)
            translateX(5px);
    }

    60% {
        transform:
            scale(.98);
    }

    100% {
        transform:
            scale(1);
    }

}


/* WRONG */

.option-btn.incorrect {

    background:
        linear-gradient(
            135deg,
            rgba(239,68,68,.30),
            rgba(185,28,28,.18)
        );

    border-color:
        #ef4444;

    color:
        #fecaca;

    animation:
        wrongAnswer .55s ease;
}

@keyframes wrongAnswer {

    0%,100% {
        transform:
            translateX(0);
    }

    20% {
        transform:
            translateX(-10px);
    }

    40% {
        transform:
            translateX(10px);
    }

    60% {
        transform:
            translateX(-7px);
    }

    80% {
        transform:
            translateX(5px);
    }

}


/* EXPLANATION */

.explanation-box {

    display: none;

    padding: 15px;

    margin-bottom: 18px;

    border-left:
        4px solid #a78bfa;

    border-radius: 10px;

    background:
        rgba(139,92,246,.12);

    color:
        rgba(255,255,255,.8);

    font-size: .9rem;

    line-height: 1.5;

    animation:
        explanationIn .4s ease;
}

@keyframes explanationIn {

    from {
        opacity: 0;
        transform:
            translateY(8px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }

}


/* NEXT */

.action-btn {

    display: none;

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #ec4899
        );

    color: white;

    font-size: 1rem;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform .2s ease;
}

.action-btn:hover {

    transform:
        translateY(-2px);
}

.action-btn:active {

    transform:
        scale(.96);
}


/* RESULT */

.result-screen {

    display: none;

    text-align: center;

    animation:
        resultEnter .7s ease;
}

@keyframes resultEnter {

    from {
        opacity: 0;
        transform:
            scale(.85)
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }

}

.result-screen h2 {

    font-size: 2rem;

    margin-bottom: 10px;
}

.score-display {

    font-size: 4rem;

    font-weight: 900;

    margin: 20px 0;

    background:
        linear-gradient(
            90deg,
            #c084fc,
            #f472b6
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.result-details {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin:
        20px 0 25px;
}

.result-item {

    padding: 14px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid rgba(255,255,255,.1);
}

.result-item strong {

    display: block;

    font-size: 1.2rem;

    margin-bottom: 3px;
}

.result-item small {

    color:
        rgba(255,255,255,.55);
}


/* RESTART */

.restart-btn {

    border: none;

    padding: 14px 28px;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );

    color: white;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform .2s ease;
}

.restart-btn:hover {

    transform:
        translateY(-3px);
}


/* SAVING */

.saving {

    margin-top: 15px;

    font-size: .85rem;

    color:
        rgba(255,255,255,.55);
}


/* MOBILE */

@media(max-width:480px) {

    body {
        padding: 12px;
    }

    .quiz-container {
        padding: 20px;
        border-radius: 20px;
    }

    .header h1 {
        font-size: 1.5rem;
    }

    .question-text {
        font-size: 1.12rem;
    }

    .score-display {
        font-size: 3.3rem;
    }

}

</style>
</head>


<body>


<div class="quiz-container">


    <!-- HEADER -->

    <div class="header">

        <h1>
            Sentence Completion Quiz
        </h1>

        <p>
            Test Your English Grammar
        </p>

    </div>


    <!-- PARTICIPANT -->

    <div
        class="participant-screen"
        id="participant-screen"
    >

        <h2>
            Before You Start
        </h2>

        <p>
            Enter your name or nickname
        </p>

        <input
            type="text"
            id="participant-name"
            class="name-input"
            placeholder="Your name / nickname"
            maxlength="40"
            autocomplete="off"
        >

        <button
            class="start-quiz-btn"
            onclick="startQuiz()"
        >
            START QUIZ
        </button>

    </div>


    <!-- QUIZ -->

    <div id="quiz-box">


        <div class="progress-bar-container">

            <div
                class="progress-bar"
                id="progress-bar"
            ></div>

        </div>


        <div class="quiz-info">

            <span id="question-counter">
                Question 1 of 15
            </span>

            <span id="timer">
                00:00
            </span>

        </div>


        <div
            class="question-text"
            id="question-text"
        >
            Loading...
        </div>


        <ul
            class="options-list"
            id="options-list"
        ></ul>


        <div
            class="explanation-box"
            id="explanation-box"
        ></div>


        <button
            class="action-btn"
            id="next-btn"
            onclick="nextQuestion()"
        >
            Next Question
        </button>

    </div>


    <!-- RESULT -->

    <div
        class="result-screen"
        id="result-screen"
    >

        <h2>
            Quiz Completed!
        </h2>

        <p id="result-name"></p>

        <div
            class="score-display"
            id="final-score"
        >
            0 / 15
        </div>


        <div class="result-details">

            <div class="result-item">

                <strong id="percentage">
                    0%
                </strong>

                <small>
                    Percentage
                </small>

            </div>


            <div class="result-item">

                <strong id="time-result">
                    00:00
                </strong>

                <small>
                    Time Taken
                </small>

            </div>


            <div class="result-item">

                <strong id="correct-result">
                    0
                </strong>

                <small>
                    Correct
                </small>

            </div>


            <div class="result-item">

                <strong id="wrong-result">
                    0
                </strong>

                <small>
                    Wrong
                </small>

            </div>

        </div>


        <p id="score-message"></p>

        <p
            id="saving-message"
            class="saving"
        >
            Saving your result...
        </p>


        <br>


        <button
            class="restart-btn"
            onclick="restartQuiz()"
        >
            Try Again
        </button>

    </div>

</div>


<script>


/* =========================================================
   GOOGLE APPS SCRIPT URL
   =========================================================

   AFTER CREATING YOUR GOOGLE APPS SCRIPT:

   Replace the URL below with your Web App URL.

   Example:

   const GOOGLE_SCRIPT_URL =
   "https://script.google.com/macros/s/XXXXXXXX/exec";

   ========================================================= */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/PASTE_YOUR_SCRIPT_URL_HERE/exec";


/* =========================================================
   QUESTIONS
   ========================================================= */

const questions = [

{
    question:
    "It is high time we __________.",

    options: [
        "change our bad habits",
        "changed our bad habits",
        "will change our bad habits",
        "have changed our bad habits"
    ],

    answer: 1,

    explanation:
    "Rule: 'It is high time' is followed by the simple past (V2)."
},

{
    question:
    "Walk fast lest __________.",

    options: [
        "you will miss the train",
        "you should miss the train",
        "you might missed the train",
        "you do not miss the train"
    ],

    answer: 1,

    explanation:
    "Rule: Lest is normally followed by subject + should + base verb."
},

{
    question:
    "He was so weak that __________.",

    options: [
        "he could not walk",
        "he cannot walk",
        "he will not walk",
        "he is unable to walk"
    ],

    answer: 0,

    explanation:
    "Rule: In a past context, so...that commonly takes could/could not."
},

{
    question:
    "Had I known his address, I __________.",

    options: [
        "will visit him",
        "would visit him",
        "would have visited him",
        "had visited him"
    ],

    answer: 2,

    explanation:
    "Rule: Had + subject + V3 is a third conditional inversion and takes would have + V3."
},

{
    question:
    "No sooner had the teacher entered the classroom than __________.",

    options: [
        "the students stood up",
        "the students stand up",
        "the students had stood up",
        "the students will stand up"
    ],

    answer: 0,

    explanation:
    "Rule: No sooner had...than is followed by a simple past clause."
},

{
    question:
    "He speaks as if __________.",

    options: [
        "he knows everything",
        "he knew everything",
        "he has known everything",
        "he will know everything"
    ],

    answer: 1,

    explanation:
    "Rule: For an unreal present situation, as if is followed by simple past."
},

{
    question:
    "Scarcely had I reached the station when __________.",

    options: [
        "the train left",
        "the train leaves",
        "the train had left",
        "the train would leave"
    ],

    answer: 0,

    explanation:
    "Rule: Scarcely had...when is followed by a simple past clause."
},

{
    question:
    "You cannot succeed in life unless __________.",

    options: [
        "you do not work hard",
        "you work hard",
        "you will work hard",
        "you worked hard"
    ],

    answer: 1,

    explanation:
    "Rule: Unless already means if not, so an affirmative clause is used."
},

{
    question:
    "The box is too heavy for him __________.",

    options: [
        "to carry it",
        "to carry",
        "carrying",
        "that he cannot carry"
    ],

    answer: 1,

    explanation:
    "Rule: Too + adjective + for someone is followed by to + base verb."
},

{
    question:
    "Five years have passed since __________.",

    options: [
        "I last meet you",
        "I last met you",
        "I have last met you",
        "I had last met you"
    ],

    answer: 1,

    explanation:
    "Rule: Since with a present perfect main clause normally takes simple past in the since-clause."
},

{
    question:
    "Strike the iron while __________.",

    options: [
        "it was hot",
        "it is hot",
        "it will be hot",
        "it becomes hot"
    ],

    answer: 1,

    explanation:
    "Rule: The correct proverb is 'Strike the iron while it is hot.'"
},

{
    question:
    "He worked hard so that __________.",

    options: [
        "he can secure good marks",
        "he could secure good marks",
        "he will secure good marks",
        "he secures good marks"
    ],

    answer: 1,

    explanation:
    "Rule: In a past context, so that commonly takes could + base verb."
},

{
    question:
    "I went to the bank with a view to __________.",

    options: [
        "open a savings account",
        "opening a savings account",
        "opened a savings account",
        "to open a savings account"
    ],

    answer: 1,

    explanation:
    "Rule: With a view to is followed by a gerund (V-ing)."
},

{
    question:
    "If you had invited me, I __________.",

    options: [
        "would attend the party",
        "will have attended the party",
        "would have attended the party",
        "had attended the party"
    ],

    answer: 2,

    explanation:
    "Rule: Third conditional: If + past perfect → would have + V3."
},

{
    question:
    "United we stand, __________.",

    options: [
        "divided we fall",
        "divided we fail",
        "together we win",
        "separated we fall"
    ],

    answer: 0,

    explanation:
    "Rule: The proverb is 'United we stand, divided we fall.'"
}

];


let currentQuestion = 0;

let score = 0;

let participantName = "";

let startTime = 0;

let timerInterval = null;

let selectedAnswers = [];


/* =========================================================
   ELEMENTS
   ========================================================= */

const participantScreen =
document.getElementById("participant-screen");

const quizBox =
document.getElementById("quiz-box");

const resultScreen =
document.getElementById("result-screen");

const questionCounter =
document.getElementById("question-counter");

const questionText =
document.getElementById("question-text");

const optionsList =
document.getElementById("options-list");

const explanationBox =
document.getElementById("explanation-box");

const nextBtn =
document.getElementById("next-btn");

const progressBar =
document.getElementById("progress-bar");

const timer =
document.getElementById("timer");


/* =========================================================
   START QUIZ
   ========================================================= */

function startQuiz() {

    const input =
    document.getElementById("participant-name");

    participantName =
    input.value.trim();

    if (!participantName) {

        input.focus();

        input.style.borderColor =
        "#ef4444";

        return;
    }

    input.style.borderColor =
    "rgba(255,255,255,.18)";

    participantScreen.style.display =
    "none";

    quizBox.style.display =
    "block";

    currentQuestion = 0;

    score = 0;

    selectedAnswers = [];

    startTime = Date.now();

    startTimer();

    loadQuestion();
}


/* =========================================================
   TIMER
   ========================================================= */

function startTimer() {

    clearInterval(timerInterval);

    timerInterval =
    setInterval(() => {

        const elapsed =
        Date.now() - startTime;

        timer.textContent =
        formatTime(elapsed);

    }, 1000);
}


function formatTime(milliseconds) {

    const totalSeconds =
    Math.floor(milliseconds / 1000);

    const minutes =
    Math.floor(totalSeconds / 60);

    const seconds =
    totalSeconds % 60;

    return (
        String(minutes).padStart(2,"0")
        + ":" +
        String(seconds).padStart(2,"0")
    );
}


/* =========================================================
   LOAD QUESTION
   ========================================================= */

function loadQuestion() {

    const q =
    questions[currentQuestion];

    questionCounter.textContent =
    `Question ${currentQuestion + 1} of ${questions.length}`;

    questionText.classList.remove(
        "question-enter"
    );

    void questionText.offsetWidth;

    questionText.classList.add(
        "question-enter"
    );

    questionText.textContent =
    q.question;

    progressBar.style.width =
    `${((currentQuestion) / questions.length) * 100}%`;

    optionsList.innerHTML = "";

    explanationBox.style.display =
    "none";

    nextBtn.style.display =
    "none";


    q.options.forEach(
        (option,index) => {

            const button =
            document.createElement("button");

            button.className =
            "option-btn";

            button.textContent =
            option;

            button.onclick =
            () => selectOption(index);

            optionsList.appendChild(
                button
            );

        }
    );
}


/* =========================================================
   SELECT ANSWER
   ========================================================= */

function selectOption(selectedIndex) {

    const q =
    questions[currentQuestion];

    const buttons =
    optionsList.children;

    selectedAnswers[currentQuestion] =
    selectedIndex;


    for (
        let i = 0;
        i < buttons.length;
        i++
    ) {

        buttons[i].disabled =
        true;

        if (i === q.answer) {

            buttons[i].classList.add(
                "correct"
            );

        }

    }


    if (
        selectedIndex === q.answer
    ) {

        score++;

    } else {

        buttons[selectedIndex]
        .classList.add(
            "incorrect"
        );

    }


    explanationBox.textContent =
    q.explanation;

    explanationBox.style.display =
    "block";

    nextBtn.style.display =
    "block";
}


/* =========================================================
   NEXT
   ========================================================= */

function nextQuestion() {

    currentQuestion++;

    if (
        currentQuestion <
        questions.length
    ) {

        loadQuestion();

    } else {

        showResults();

    }
}


/* =========================================================
   RESULTS
   ========================================================= */

function showResults() {

    clearInterval(timerInterval);

    const totalTime =
    Date.now() - startTime;

    const percentage =
    Math.round(
        (score / questions.length) * 100
    );

    const wrong =
    questions.length - score;


    quizBox.style.display =
    "none";

    resultScreen.style.display =
    "block";


    document.getElementById(
        "result-name"
    ).textContent =
    participantName;


    document.getElementById(
        "final-score"
    ).textContent =
    `${score} / ${questions.length}`;


    document.getElementById(
        "percentage"
    ).textContent =
    `${percentage}%`;


    document.getElementById(
        "time-result"
    ).textContent =
    formatTime(totalTime);


    document.getElementById(
        "correct-result"
    ).textContent =
    score;


    document.getElementById(
        "wrong-result"
    ).textContent =
    wrong;


    const message =
    document.getElementById(
        "score-message"
    );


    if (percentage === 100) {

        message.textContent =
        "Perfect score! Outstanding grammar skills!";

    } else if (percentage >= 70) {

        message.textContent =
        "Great job! You have a solid grasp of grammar rules.";

    } else {

        message.textContent =
        "Good effort! Review the rules and try again.";

    }


    saveResult(
        totalTime,
        percentage
    );
}


/* =========================================================
   SAVE RESULT TO GOOGLE SHEETS
   ========================================================= */

function saveResult(
    totalTime,
    percentage
) {

    const savingMessage =
    document.getElementById(
        "saving-message"
    );


    if (
        GOOGLE_SCRIPT_URL.includes(
            "PASTE_YOUR_SCRIPT_URL_HERE"
        )
    ) {

        savingMessage.textContent =
        "⚠️ Result display works, but Google Sheets is not connected yet.";

        return;
    }


    savingMessage.textContent =
    "Saving your result...";


    const resultData = {

        name:
        participantName,

        score:
        score,

        total:
        questions.length,

        percentage:
        percentage,

        time:
        formatTime(totalTime),

        answers:
        JSON.stringify(
            selectedAnswers
        ),

        timestamp:
        new Date().toISOString()

    };


    fetch(
        GOOGLE_SCRIPT_URL,
        {

            method: "POST",

            mode: "no-cors",

            headers: {
                "Content-Type":
                "application/json"
            },

            body:
            JSON.stringify(
                resultData
            )

        }
    )
    .then(() => {

        savingMessage.textContent =
        "✓ Result recorded successfully.";

    })
    .catch(() => {

        savingMessage.textContent =
        "Could not connect to the result server.";

    });

}


/* =========================================================
   RESTART
   ========================================================= */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    selectedAnswers = [];

    participantName = "";

    resultScreen.style.display =
    "none";

    participantScreen.style.display =
    "block";

    document.getElementById(
        "participant-name"
    ).value = "";

    timer.textContent =
    "00:00";
}


</script>
